[project]
name = "nano-re"
version = "0.1.0"
description = "Multi-task NER and document-level relation extraction with INT8 ONNX deployment"
readme = "README.md"
authors = [
    { name = "Patryk Pasek", email = "patrykpasek@onet.pl" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "huggingface-hub>=1.26.0",
    "jupyterlab>=4.6.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "onnxscript>=0.7.1",
    "optimum>=2.2.0",
    "scikit-learn>=1.9.0",
    "seqeval>=1.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[project.scripts]
nano-re = "nano_re.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
